<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#09131b" />
  <meta name="description" content="Comprehensive Fitness Library - Evidence-Based Exercise Science Database" />
  
  <!-- Preload Share Tech Mono font for better performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  
  <title>FITNESS LIBRARY :: TERMINAL ACCESS</title>
  
  <style>
    /* Prevent flash of unstyled content */
    body {
      margin: 0;
      background-color: #09131b;
      color: #08f7fe;
      font-family: 'Share Tech Mono', monospace;
      overflow-x: hidden;
    }
    
    /* Loading animation */
    .loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      background: #09131b;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    
    .loading-text {
      color: #08f7fe;
      font-family: 'Share Tech Mono', monospace;
      font-size: 1.2rem;
      margin-bottom: 2rem;
      text-shadow: 0 0 10px #08f7fe;
    }
    
    .loading-bar {
      width: 300px;
      height: 2px;
      background: rgba(8, 247, 254, 0.2);
      position: relative;
      overflow: hidden;
    }
    
    .loading-progress {
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, #08f7fe, transparent);
      animation: loading 2s infinite;
    }
    
    @keyframes loading {
      0% { left: -100%; }
      100% { left: 100%; }
    }
    
    .cursor {
      animation: blink 1s infinite;
    }
    
    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }
  </style>
</head>
<body>
  <noscript>
    <div style="padding: 2rem; text-align: center;">
      <h1>TERMINAL ACCESS DENIED</h1>
      <p>JavaScript required for system access.</p>
    </div>
  </noscript>
  
  <!-- Loading Screen -->
  <div id="loading-screen" class="loading-screen">
    <div class="loading-text">
      INITIALIZING FITNESS LIBRARY TERMINAL<span class="cursor">_</span>
    </div>
    <div class="loading-bar">
      <div class="loading-progress"></div>
    </div>
  </div>
  
  <div id="root"></div>
  
  <script>
    // Remove loading screen after React loads
    window.addEventListener('load', () => {
      setTimeout(() => {
        const loadingScreen = document.getElementById('loading-screen');
        if (loadingScreen) {
          loadingScreen.style.opacity = '0';
          setTimeout(() => {
            loadingScreen.remove();
          }, 500);
        }
      }, 1500);
    });
  </script>
</body>
</html>
